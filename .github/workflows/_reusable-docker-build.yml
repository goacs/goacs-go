name: Reusable - Build & Push

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref (branch, tag or SHA) to build
        required: true
        type: string
      image-tag:
        description: Primary tag applied to both images (e.g. manual-v2-abc1234, nightly, v1.2.3)
        required: true
        type: string
      extra-tags:
        description: Comma-separated additional tags to also push (e.g. "latest")
        required: false
        type: string
        default: ""
      push:
        description: Push images to ghcr.io (false only builds, for smoke-testing)
        required: false
        type: boolean
        default: true
      artifact-retention-days:
        description: Retention (in days) for the uploaded binary/dist artifacts
        required: false
        type: number
        default: 14
    outputs:
      short-sha:
        description: Short SHA of the built ref
        value: ${{ jobs.prepare.outputs.short-sha }}

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      short-sha: ${{ steps.vars.outputs.short-sha }}
      build-date: ${{ steps.vars.outputs.build-date }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - id: vars
        run: |
          echo "short-sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build-date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  build-images:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            image: ghcr.io/goacs/goacs-go-backend
            context: .
            dockerfile: Dockerfile
          - component: frontend
            image: ghcr.io/goacs/goacs-go-frontend
            context: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tags
        env:
          EXTRA_TAGS: ${{ inputs.extra-tags }}
        run: |
          tags="${{ matrix.image }}:${{ inputs.image-tag }}"
          IFS=',' read -ra EXTRA <<< "$EXTRA_TAGS"
          for t in "${EXTRA[@]}"; do
            t="$(echo "$t" | xargs)"
            if [ -n "$t" ]; then
              tags="$tags
          ${{ matrix.image }}:$t"
            fi
          done
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ inputs.image-tag }}
            COMMIT=${{ needs.prepare.outputs.short-sha }}
            DATE=${{ needs.prepare.outputs.build-date }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  build-binaries:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build \
            -ldflags "-s -w -X main.version=${{ inputs.image-tag }} -X main.commit=${{ needs.prepare.outputs.short-sha }} -X main.date=${{ needs.prepare.outputs.build-date }}" \
            -o dist/goacs .
          tar -czf goacs-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz -C dist goacs
      - uses: actions/upload-artifact@v4
        with:
          name: goacs-${{ matrix.goos }}-${{ matrix.goarch }}
          path: goacs-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
          retention-days: ${{ inputs.artifact-retention-days }}

  build-frontend-dist:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm run build
          tar -czf ../frontend-dist.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist.tar.gz
          retention-days: ${{ inputs.artifact-retention-days }}
